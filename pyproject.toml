[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["features", "leverage", "train", "evaluate", "build_dataset", "lift", "charts", "conftest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# The app pages keep their compact, hand-wrapped imports.
"views/*.py" = ["I001", "B905"]
